name: Build pinned CPU-verified environment
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pinned-environment-build
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_REPOSITORY: ghcr.io/brohrt/phone-llm-environment
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check architecture and prepare disk headroom
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          test "$(uname -m)" = x86_64
          test "$(uname -s)" = Linux
          df -B1 . > evidence/disk-before.txt
          # Only disposable hosted-runner toolchains, never project files.
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /usr/local/.ghcup /opt/hostedtoolcache /usr/local/share/powershell /usr/local/swift
          docker image prune --all --force
          df -B1 . > evidence/disk-after.txt
          /usr/bin/python3 - <<'PY'
          import json,pathlib,shutil,platform,time
          free=shutil.disk_usage('.').free
          record={'issued_unix':time.time(),'system':platform.system(),'architecture':platform.machine(),'free_bytes':free,'minimum_free_bytes':55*1024**3,'gpu_requested':False,'disk_requirement_is_preflight_not_measured_peak':True}
          pathlib.Path('evidence/runner.json').write_text(json.dumps(record,indent=2)+'\n')
          if free<record['minimum_free_bytes']:raise SystemExit('Insufficient disk: require55GiB before pulling/building multi-gigabyte image')
          PY
      - name: Authenticate GHCR with this job token only
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build, verify imports and SSH, publish, reverify digest
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -u build_image.py --tag "$IMAGE_REPOSITORY:stack-$GITHUB_SHA" --out evidence/build --publish 2>&1 | tee evidence/build-driver.log
      - name: Record actual immutable image reference
        run: |
          /usr/bin/python3 - <<'PY'
          import json,os,pathlib
          r=json.loads(pathlib.Path('evidence/build/IMAGE_RECEIPT.json').read_text())
          assert r['status']=='DIGEST_PINNED_IMAGE_VERIFIED' and r['digest_pull_reverified']
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:f.write('Verified image: `'+r['image']+'`\n\nCPU-only version/import and SSH checks passed. GPU CUDA availability remains an in-run check.\n')
          PY
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: environment-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Remove registry login from disposable runner
        if: always()
        run: docker logout ghcr.io
